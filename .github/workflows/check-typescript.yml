name: Node

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: Build JS packages
        run: pnpm build:js
      - name: Build native addon
        run: node scripts/build.mjs napi
      - name: CLI smoke test
        run: |
          printf 'local x = 1\n' > "$RUNNER_TEMP/smoke.lua"
          node packages/lua.ts/packages/lua/bin/lua.mjs version
          node packages/lua.ts/packages/lua/bin/lua.mjs parse "$RUNNER_TEMP/smoke.lua"
          node packages/lua.ts/packages/lua-harness/bin/lua-harness.mjs check "$RUNNER_TEMP/smoke.lua"

  homepage:
    name: Homepage and docs
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check homepage and docs
        run: pnpm --filter @nyar/lua-homepage run check
      - name: Build homepage and user docs
        run: pnpm --filter @nyar/lua-homepage run build
